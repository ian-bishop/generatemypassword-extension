<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>GenerateMyPassword Store Screenshot</title>
  <link rel="stylesheet" href="../../style.css">
  <style>
    html, body { width: 100%; min-height: 800px; }
    body {
      display: grid;
      width: auto;
      min-height: 800px;
      place-items: center;
      background:
        radial-gradient(circle at 16% 18%, rgba(49, 87, 213, .19), transparent 26rem),
        radial-gradient(circle at 84% 78%, rgba(17, 137, 121, .14), transparent 28rem),
        #eef3fb;
    }
    main {
      width: 390px;
      transform: scale(1.25);
      border: 1px solid rgba(216, 224, 238, .9);
      border-radius: 18px;
      background: #f5f7fb;
      box-shadow: 0 28px 70px rgba(23, 36, 58, .2);
    }
  </style>
</head>
<body>
  <main>
    <header><div class="mark" aria-hidden="true">✦</div><div><h1>GenerateMyPassword</h1><p>Secure passwords, generated privately</p></div></header>
    <div class="tabs" role="tablist" aria-label="Generator mode"><button id="passwordTab" class="tab active" role="tab" aria-selected="true" aria-controls="passwordPanel">Password</button><button id="phraseTab" class="tab" role="tab" aria-selected="false" aria-controls="phrasePanel">Passphrase</button></div>
    <div class="result-heading"><label for="result">Your <span id="resultType">password</span></label><button class="text-button" id="visibility" aria-pressed="true">Hide</button></div>
    <div class="output"><output id="result" aria-live="polite"></output><button id="copy" title="Copy generated value">Copy</button></div>
    <div class="strength"><div class="strength-top"><span id="strengthText">Strength</span><span id="entropy">—</span></div><div class="meter" aria-hidden="true"><span id="meterFill"></span></div></div>
    <section id="passwordPanel" role="tabpanel" aria-labelledby="passwordTab"><div class="length"><label for="length">Password length</label><input id="lengthNumber" type="number" min="8" max="128" value="20" aria-label="Password length exact value"></div><input id="length" type="range" min="8" max="128" value="20">
      <fieldset class="checks"><legend>Include characters</legend><label><input type="checkbox" id="lower" checked> Lowercase (a–z)</label><label><input type="checkbox" id="upper" checked> Uppercase (A–Z)</label><label><input type="checkbox" id="digits" checked> Numbers (0–9)</label><label><input type="checkbox" id="symbols" checked> Symbols (!@#…)</label></fieldset><label class="single-check"><input type="checkbox" id="ambiguous"> Exclude ambiguous characters (0/O, 1/l/I)</label>
    </section>
    <section id="phrasePanel" role="tabpanel" aria-labelledby="phraseTab" hidden><div class="length"><label for="wordCount">Number of words</label><select id="wordCount"><option value="4">4</option><option value="5">5</option><option value="6" selected>6</option><option value="8">8</option></select></div><div class="length"><label for="separator">Word separator</label><select id="separator"><option value="-">Hyphen (-)</option><option value=" ">Space</option><option value=".">Period (.)</option><option value="_">Underscore (_)</option></select></div><label class="single-check"><input type="checkbox" id="capitalize"> Capitalize each word</label><p class="hint">Diceware-style: <span id="wordlistInfo">7,776</span> bundled words, selected independently. No network requests.</p></section>
    <p id="error" role="alert"></p><button id="generate" class="primary">Generate password</button><footer><span>Offline • No tracking • No password history</span><a href="https://generatemypassword.com/" target="_blank" rel="noopener noreferrer">Website ↗</a></footer>
  </main>
  <script>globalThis.chrome = { runtime: { getURL: path => `../../${path}` } };</script>
  <script src="../../popup.js"></script>
</body>
</html>
